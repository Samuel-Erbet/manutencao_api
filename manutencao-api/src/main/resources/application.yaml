spring:
  application:
    name: manutencao-api
  datasource:
      url: jdbc:mysql://localhost:3306/maintenance_tickets
      username: root
      password: 123456
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        schema: migrations

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true


logging:
  level:
    org:
      flywaydb: DEBUG
  springframework:
    boot:
      autoconfigure:
        flyway: DEBUG